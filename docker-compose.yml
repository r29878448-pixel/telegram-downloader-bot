# 2GB zip (with the local Bot API server, max limit)
# Put these in .env:
#   TELEGRAM_API_ID=...
#   TELEGRAM_API_HASH=...
#   BOT_TOKEN=...
name: tgbot-localapi
services:
  botapi:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_STAT: "1"
    command: >-
      --local
      --http-port 8081
      --dir /var/lib/telegram-bot-api
      --temp-dir /tmp/telegram-bot-api
      --log-level 2
    volumes:
      - botapi-data:/var/lib/telegram-bot-api
    expose:
      - "8081"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - botapi
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ALLOWED_IDS: ${ALLOWED_IDS:-}
      TELEGRAM_API_BASE_URL: http://botapi:8081/bot
      TELEGRAM_API_BASE_FILE_URL: http://botapi:8081/file/bot
    # 2GB zip + source both live in /tmp, so use a disk-backed volume.
    # A RAM-backed tmpfs cannot hold 2GB+2GB (it would OOM).
    volumes:
      - tmpdata:/tmp
      # Login-walled site/media (IG, YT, FB...) — host ./cookies/cookies.txt
      # (Netscape format) is mounted read-only at /app/cookies/cookies.txt.
      # An empty or missing folder is fine — the bot ignores it.
      - ./cookies:/app/cookies:ro

  # Auto-clean the botapi cache (copies of sent files) — otherwise the VPS disk fills up.
  # Deletes files older than 6h every hour. Does not touch an upload in progress.
  cleaner:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - botapi-data:/clean:rw
    command: >
      sh -c "while true; do find /clean -type f -mmin +360 -delete 2>/dev/null; sleep 3600; done"

volumes:
  botapi-data:
  tmpdata:
